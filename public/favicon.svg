<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="150" fill="none" stroke="url(#accent)" stroke-width="18" opacity="0.9"/>

  <!-- Calculator -->
  <g filter="url(#shadow)">
    <rect x="292" y="238" width="132" height="164" rx="24" fill="#f8fafc"/>
    <rect x="314" y="260" width="88" height="34" rx="9" fill="#1e1b4b"/>
    <g fill="#4f46e5">
      <rect x="314" y="310" width="20" height="20" rx="6"/>
      <rect x="344" y="310" width="20" height="20" rx="6"/>
      <rect x="374" y="310" width="20" height="20" rx="6"/>
      <rect x="314" y="340" width="20" height="20" rx="6"/>
      <rect x="344" y="340" width="20" height="20" rx="6"/>
      <rect x="374" y="340" width="20" height="20" rx="6"/>
      <rect x="314" y="370" width="20" height="20" rx="6"/>
      <rect x="344" y="370" width="20" height="20" rx="6"/>
      <rect x="374" y="370" width="20" height="20" rx="6"/>
    </g>
  </g>

  <!-- Rupee -->
  <text x="238" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="205" font-weight="800" fill="#ffffff" filter="url(#shadow)">₹</text>

  <!-- Growth bars -->
  <g fill="url(#accent)">
    <rect x="90" y="380" width="30" height="48" rx="8"/>
    <rect x="130" y="350" width="30" height="78" rx="8"/>
    <rect x="170" y="315" width="30" height="113" rx="8"/>
  </g>
  <path d="M92 365 C126 342 150 320 196 282" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M184 282 L202 279 L196 297" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="256" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="5" fill="#ffffff">INTEREST</text>
  <text x="256" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="6" fill="#67e8f9">BUDDY</text>
</svg>
